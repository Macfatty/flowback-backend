name: Build and Push Backend Image

on:
  push:
    branches:
      - development
      - master
    tags:
      - 'v*.*.*' # Also triggers when you create a release tag (e.g., v1.0.0)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Generates smart tags (e.g., :development, :v1.0.0, :sha-12345)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Added :3001 to specify the correct port for the local registry
          images: git.local:3001/${{ gitea.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          # Added :3001 to match the insecure-registry configured on the Pi
          registry: git.local:3001
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
