name: Flowback Backend CI/CD
on: [push]

jobs:
  lint-and-test:
    runs-on: native-arm64
    steps:
      - uses: actions/checkout@v4
      
      - name: Static Code Analysis (Ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Run Tests (Pytest)
        run: |
          pip install pytest
          pytest

  build-and-deploy:
    needs: lint-and-test
    runs-on: native-arm64
    steps:
      - name: Build Docker Image
        run: docker build -t flowback-backend:latest .
      
      - name: Deploy Container
        run: |
          docker stop flowback-backend || true
          docker rm flowback-backend || true
          docker run -d --name flowback-backend \
            --restart unless-stopped \
            -p 8000:8000 \
            flowback-backend:latest
